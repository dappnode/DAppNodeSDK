name: Test GA build
on:
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  # The build bot creates/updates its comment through the issues API; on a pull
  # request GitHub requires pull-requests: write for that.
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: yarn install --frozen-lockfile
      - run: yarn build

      # Simulate Github Actions run on an actual DAppNode package
      - name: Setup a mock package to test locally
        run: node dist/dappnodesdk.js init --yes --force

      - run: node dist/dappnodesdk.js github-action build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINATA_API_KEY: ${{ secrets.PINATA_API_KEY }}
          PINATA_SECRET_API_KEY: ${{ secrets.PINATA_SECRET_API_KEY }}
